name: Deploy Frontend

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_API_BASE_URL: ${{ github.ref_name == 'main' && vars.VITE_API_BASE_URL_PRODUCTION || vars.VITE_API_BASE_URL_STAGING }}
          VITE_API_PREFIX: ${{ vars.VITE_API_PREFIX }}
        run: npm run build

      - name: Set deployment path
        id: env-config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_DIR=${{ vars.VPS_DEPLOY_PATH_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET_DIR=${{ vars.VPS_DEPLOY_PATH_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via Rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_SSH_HOST }}
          REMOTE_USER: ${{ secrets.VPS_SSH_USER }}
          SOURCE: "dist/"
          TARGET: ${{ steps.env-config.outputs.TARGET_DIR }}
          ARGS: "-rlgoDzc --delete"
